[build]
  base = "Frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://venue-verification-shed-simultaneously.trycloudflare.com/app"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

